<!doctype html>
<html lang="en" class="h-full bg-slate-950">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Notification Service{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
      defer
    ></script>
  </head>
  <body class="flex min-h-full flex-col text-slate-100">
    {% if is_authenticated(request) %}
    <header
      id="app-header"
      class="sticky top-0 z-10 w-full border-b border-slate-800 bg-slate-900/95 backdrop-blur"
    >
      <div
        class="flex w-full items-center justify-between gap-4 px-4 py-3 sm:px-6"
      >
        <p class="text-sm font-medium text-emerald-300">
          Logged in successfully
        </p>
        <form action="/logout" method="post" hx-post="/logout">
          <button
            type="submit"
            class="rounded-lg border border-slate-700 px-4 py-2 text-sm font-medium text-slate-200 transition hover:border-slate-500 hover:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50"
          >
            Log out
          </button>
        </form>
      </div>
    </header>
    {% endif %}
    <main class="flex flex-1 items-center justify-center px-4 py-12">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
