<div
  id="auth-card"
  class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-xl"
>
  <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
  <p class="mt-2 text-sm text-slate-400">
    Enter the service password to continue.
  </p>

  {% if error %}
  <div
    class="mt-4 rounded-lg border border-red-900 bg-red-950 px-4 py-3 text-sm text-red-200"
    role="alert"
  >
    {{ error }}
  </div>
  {% endif %}

  <form
    action="/login"
    method="post"
    hx-post="/login"
    hx-target="#auth-card"
    hx-swap="outerHTML"
    class="mt-6 space-y-4"
  >
    <div>
      <label for="password" class="block text-sm font-medium text-slate-300">
        Password
      </label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
        class="mt-2 block w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-500/30"
      />
    </div>
    <button
      type="submit"
      class="w-full rounded-lg bg-sky-600 px-4 py-2 font-medium text-white transition hover:bg-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50"
    >
      Sign in
    </button>
  </form>
</div>
